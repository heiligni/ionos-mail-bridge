[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ionos-mail-plugin-runtime"
version = "0.1.0"
description = "Local MCP server for IONOS Mail"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["keyring>=25,<26"]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.scripts]
ionos-mail-mcp = "ionos_mail_bridge.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
